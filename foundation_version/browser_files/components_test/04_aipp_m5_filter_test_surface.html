<section class="aipp-filter-manager" id="aippChamberFilterManager" aria-labelledby="aippChamberFilterHeading">
  <header class="aipp-chamber-header">
    <div>
      <span class="aipp-editor-kicker">CHAMBER CONFIGURATION</span>
      <div class="aipp-chamber-title">
        <h3 id="aippChamberFilterHeading">Chamber filters</h3>
        <span id="aippChamberFilterCount" class="aipp-chamber-count">0</span>
      </div>
      <p>Configure optional heat-loss filters and assign valid chamber outlet orifices.</p>
    </div>
    <button id="aippChamberFilterAdd" type="button">Add chamber filter</button>
  </header>
  <div class="aipp-filter-body">
    <div id="aippChamberFilterList" class="aipp-filter-list" aria-label="Chamber filter list"></div>
    <div id="aippChamberFilterDetail" class="aipp-filter-detail" aria-live="polite"></div>
  </div>
  <pre id="aippChamberFilterErrors" class="aipp-editor-errors" aria-live="polite" hidden></pre>
</section>
