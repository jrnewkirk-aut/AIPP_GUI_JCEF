// AIPP UNIFIED TRANSPORT LAYER
// =============================================

window.transportConfig = {
  useSafeQuotes: false,
  debug: true
};

// =====================
// Detection
// =====================
function detectQuoteMode(str) {
  if (typeof str === "string" && str.includes("<-quote->")) {
    window.transportConfig.useSafeQuotes = true;
  }
}

// =====================
// Decode Incoming
// =====================
function decodeIncoming(raw) {
  let str;

  if (Array.isArray(raw)) {
    str = String.fromCharCode(...raw);
  } else {
    str = raw;
  }

  detectQuoteMode(str);

  if (window.transportConfig.useSafeQuotes) {
    str = str.replace(/<-quote->/g, '"');
  }

  try {
    const msg = JSON.parse(str);

    if (window.transportConfig.debug) {
      console.log("[RX ← Scilab]", msg);
    }

    return msg;
  } catch (err) {
    console.error("[Transport ERROR] Invalid JSON:", str);
    return null;
  }
}

// =====================
// Encode Outgoing
// =====================
function encodeOutgoing(obj) {
  let str = JSON.stringify(obj);

  if (window.transportConfig.useSafeQuotes) {
    str = str.replace(/"/g, "<-quote->");
  }

  return Array.from(str).map(c => c.charCodeAt(0));
}

// =====================
// SEND (ONLY ENTRY POINT)
// =====================
function sendToScilab(msg) {
  if (!msg || !msg.type) {
    console.error("[Transport ERROR] Missing type field", msg);
    return;
  }

  if (window.transportConfig.debug) {
    console.log("[TX → Scilab]", msg);
  }

  const ascii = encodeOutgoing(msg);
  toScilab(ascii);
}

// =====================
// RECEIVE HOOK
// =====================
function fromScilab(data) {
  const msg = decodeIncoming(data);

  if (!msg || !msg.type) {
    console.error("[Transport ERROR] Invalid message");
    return;
  }

  if (typeof window.dispatchMessage === "function") {
    dispatchMessage(msg);
  } else {
    console.warn("[Transport] No dispatcher found");
  }
}

/* 09_topology_removal_workflow_v1.js
   Temporary topology removal workflow patch for the refactored v2 package.
   Load after 08_clean_topology_graph_overrides.js.

   Goals:
   - Make Remove... distinct from Scan Dependencies.
   - Show explicit allowed/blocked status.
   - Show repair guidance for blockers.
   - Keep conservative removal rules and preserve all existing features.
*/
function topologyRemovalPathText(path){
  return (path||[]).map((x,i)=>typeof x==='number'?'['+x+']':(i===0?x:'.'+x)).join('').replace('.[','[');
}
function topologyRemovalEntityLabel(type,index){
  return String(type||'entity').charAt(0).toUpperCase()+String(type||'entity').slice(1)+' '+index;
}
function topologyRemovalDirectEventRefs(report){
  return (report&&report.eventReferences||[]).filter(r=>r.severity==='blocker');
}
function topologyRemovalRemapEventRefs(report){
  return (report&&report.eventReferences||[]).filter(r=>r.severity==='remap'&&r.proposedValue!==undefined&&r.proposedValue!==null);
}
function topologyRemovalRepairGuidance(type,ref){
  let kind=ref&&ref.kind||'';
  let path=topologyRemovalPathText(ref&&ref.path||[]);
  let msg=ref&&ref.message||'Blocking dependency found.';
  if(kind==='minimum_chambers')return 'Minimum chamber count blocker: add another chamber before removing this chamber, or keep at least two chambers in the model.';
  if(kind==='orifice_connection')return msg+' Repair by editing the referenced orifice `from`/`to` chamber, removing that orifice first, or choosing a different chamber to remove. Path: '+path;
  if(kind==='wall_chamber_connection')return msg+' Repair by editing the referenced wall connection, removing that wall first, or reassigning its chamber_index. Path: '+path;
  if(kind==='event_reference')return msg+' Repair by editing the event string manually before removal. Path: '+path;
  if(kind==='filter_orifice_reference')return msg+' Repair by removing or changing the filter orifices entry before removing this orifice. Path: '+path;
  if(kind==='wall_wall_connection')return msg+' Repair by editing the wall-to-wall connection or removing the dependent wall first. Path: '+path;
  return msg+(path?' Path: '+path:'');
}
function buildRemovalPlan(type,index,report){
  let directRefs=(report&&report.directReferences)||[];
  let directEventRefs=topologyRemovalDirectEventRefs(report);
  let remapEventRefs=topologyRemovalRemapEventRefs(report);
  let blockers=[];
  let blockerItems=[];
  directRefs.forEach(r=>{blockers.push(r.message);blockerItems.push(r);});
  directEventRefs.forEach(r=>{blockers.push('Direct event reference requires manual repair before removal: '+r.message);blockerItems.push(r);});
  let warnings=[];
  if((report.shiftedReferences||[]).length)warnings.push(report.shiftedReferences.length+' index reference(s) will be remapped automatically after removal.');
  if(remapEventRefs.length)warnings.push(remapEventRefs.length+' event reference(s) can be remapped automatically if event remapping remains enabled.');
  let actions=['Create a full JSON snapshot for undo.','Remove assembly.'+(type==='chamber'?'chambers':type==='orifice'?'orifices':'walls')+'['+(index-1)+'].','Refresh tree, code editor, graph, and popup state.'];
  if((report.shiftedReferences||[]).length)actions.splice(1,0,'Apply index remaps shown in the preview.');
  if(remapEventRefs.length)actions.splice(1,0,'Apply event-string remaps if the checkbox remains enabled.');
  return {type,index,report,blockers,warnings,actions,directEventRefs,remapEventRefs,blockerItems,allowed:blockers.length===0};
}
function openRemovePreview(){
  if(!popupNode||!popupPath){setStatus('No selected entity to remove.',false);return;}
  if(typeof applyPopupEditsForTopologyIfNeeded==='function')applyPopupEditsForTopologyIfNeeded();
  let idx=Number(popupPath[popupPath.length-1])+1;
  let report=scanEntityDependencies(popupNode.type,idx,'delete');
  pendingRemovalPlan=buildRemovalPlan(popupNode.type,idx,report);
  showRemovePreview(pendingRemovalPlan);

function showRemovePreview(plan){
  let modal=document.getElementById('removeModal'),body=document.getElementById('removeModalBody'),title=document.getElementById('removeModalTitle'),btn=document.getElementById('applyRemoveBtn'),status=document.getElementById('removeModalStatus');
  if(!modal||!body||!title||!btn||!status){setStatus('Remove preview modal is not available.',false);return;}
  title.textContent='Remove Preview: '+topologyRemovalEntityLabel(plan.type,plan.index);
  body.innerHTML='';

  let banner=document.createElement('div');
  banner.className='removePlan '+(plan.allowed?'removeAllowed':'removeBlocked');
  let bh=document.createElement('div');
  bh.className='removePlanTitle';
  bh.textContent=plan.allowed?'Removal allowed':'Removal blocked';
  let bb=document.createElement('div');
  bb.className='removePlanBody';
  bb.innerHTML=plan.allowed
    ? '<b>No direct blockers were found.</b><br>Review the planned actions and remaps before applying removal.'
    : '<b>Direct dependencies must be repaired before this entity can be removed.</b><br>The Apply Removal button is disabled until blockers are resolved.';
  banner.append(bh,bb);
  body.appendChild(banner);

  topologyRemovalRenderPlanList(body,'Planned actions',plan.actions,'removeAllowed');
  topologyRemovalRenderPlanList(body,'Blocking issues',plan.blockers,'removeBlocked');
  topologyRemovalRenderRepairGuidance(body,plan);
  topologyRemovalRenderPlanList(body,'Warnings',plan.warnings,'removeWarn');
  topologyRemovalRenderIndexPreview(body,plan);
  topologyRemovalRenderEventPreview(body,plan);

  btn.disabled=!plan.allowed;
  btn.textContent=plan.allowed?'Apply Removal':'Apply Removal - Blocked';

function topologyRemovalRenderEventPreview(parent,plan){
  let box=document.createElement('div');box.className='removePlan removeWarn';
  let h=document.createElement('div');h.className='removePlanTitle';h.textContent='Event remap preview ('+plan.remapEventRefs.length+')';box.appendChild(h);
  let b=document.createElement('div');b.className='removePlanBody';

    let chk=document.createElement('input');chk.type='checkbox';chk.checked=applyEventRemapsOnRemoval;chk.onchange=()=>applyEventRemapsOnRemoval=chk.checked;
    label.append(chk,document.createTextNode('Apply these event-string remaps during removal'));

  }
  box.appendChild(b);parent.appendChild(box);

function topologyRemovalMakePreviewTable(refs){
  let table=document.createElement('table');table.className='eventRemapTable';
  table.innerHTML='<thead><tr><th>JSON path</th><th>Current</th><th>Proposed</th></tr></thead><tbody></tbody>';
  let tb=table.querySelector('tbody');
  refs.forEach(r=>{let tr=document.createElement('tr');tr.innerHTML='<td class="eventRemapPath">'+escapeHtml(topologyRemovalPathText(r.path||[]))+'</td><td><span class="eventRemapValue">'+escapeHtml(String(r.currentValue))+'</span></td><td><span class="eventRemapValue">'+escapeHtml(String(r.proposedValue))+'</span></td>';tb.appendChild(tr);});

function applyRemovalFromPreview(){
  if(!pendingRemovalPlan||!pendingRemovalPlan.allowed){setStatus('Removal is blocked. Resolve direct dependencies first.',false);return;}
  lastRemovalSnapshot=deepCopy(fullJson);
  let plan=pendingRemovalPlan,info=ensureAssembly(),a=info.assembly,idx0=plan.index-1;
  if(applyEventRemapsOnRemoval)applyEventReferenceRemaps(plan.remapEventRefs);
  if(plan.type==='chamber'){
    applyChamberIndexDeleteRemap(plan.index);
    a.chambers.splice(idx0,1);
  }else if(plan.type==='orifice'){
    applyOrificeIndexDeleteRemap(plan.index);
    a.orifices.splice(idx0,1);

    applyWallIndexDeleteRemap(plan.index);

/* 12_flow_chart_overlay_sync_v2.js
   Replacement for 12_flow_chart_overlay_sync_v1.js.
   Load after 11_flow_chart_chamber_cards_v1.js.

   Root cause fixed:
   - v1 referenced window.cyPrototype, but cyPrototype is declared with top-level `let` in the bundle.
   - Top-level `let` variables are not properties of window, so v1 frequently saw no graph instance.
   - This replacement uses the lexical cyPrototype variable used by the existing graph engine.

   Purpose:
   - Keep HTML chamber detail cards aligned to Cytoscape chamber nodes during pan/zoom/fit/layout.
   - Resize the detail card to match the rendered Cytoscape chamber rectangle.
   - Remove stale overlay cards after graph rebuilds.
*/
(function(){
  if(window.__aippFlowChartOverlaySyncV2Applied) return;
  window.__aippFlowChartOverlaySyncV2Applied = true;

  var overlaySyncRaf = null;
  var listenersInstalledFor = null;

  function getCy(){
    try{
      if(typeof cyPrototype !== 'undefined' && cyPrototype) return cyPrototype;
    }catch(e){}
    return null;
  }

  function requestOverlaySync(){
    if(overlaySyncRaf) cancelAnimationFrame(overlaySyncRaf);
    overlaySyncRaf = requestAnimationFrame(syncOverlayToRenderedNodes);
  }

  function installOverlaySyncListeners(){
    var cy = getCy();
    if(!cy || listenersInstalledFor === cy) return;
    listenersInstalledFor = cy;
    try{
      cy.on('pan zoom viewport resize render', requestOverlaySync);
      cy.on('position drag free', 'node', requestOverlaySync);
      cy.ready(function(){ requestOverlaySync(); });
    }catch(e){
      try{ console.warn('AIPP overlay sync listener install failed', e); }catch(_e){}
    }
  }

  function syncOverlayToRenderedNodes(){
    overlaySyncRaf = null;
    var cy = getCy();
    if(!cy) return;
    var layer = document.getElementById('cyChamberOverlayLayer');
    if(!layer) return;

    var liveIds = {};
    try{
      cy.nodes('[type="chamber"]').forEach(function(node){ liveIds['cyOverlay_'+node.id()] = true; });
      layer.querySelectorAll('.cyChamberCardOverlay').forEach(function(card){
        if(!liveIds[card.id] && card.parentNode) card.parentNode.removeChild(card);
      });
    }catch(e){}

    try{
      cy.nodes('[type="chamber"]').forEach(function(node){
        var card = document.getElementById('cyOverlay_'+node.id());
        if(!card) return;
        var bb = node.renderedBoundingBox({includeLabels:false});
        var w = Math.max(80, bb.w + 2);
        var h = Math.max(52, bb.h + 2);

        card.style.left = (bb.x1 - 1) + 'px';
        card.style.top = (bb.y1 - 1) + 'px';
        card.style.width = w + 'px';
        card.style.height = h + 'px';
        card.style.minHeight = h + 'px';
        card.style.transform = 'none';
        card.style.willChange = 'left, top, width, height';
      });
    }catch(e){
      try{ console.warn('AIPP overlay sync failed', e); }catch(_e){}
    }
  }

    requestOverlaySync();
    setTimeout(requestOverlaySync, 0);
    setTimeout(requestOverlaySync, 60);
  };

  var originalRender = window.renderCytoscapePrototype;
  window.renderCytoscapePrototype = function(){
    if(typeof originalRender === 'function') originalRender();

    });
  };

  window.applyAippCytoscapeLayout = function(anim){

    });
  };

  setTimeout(function(){ installOverlaySyncListeners(); requestOverlaySync(); }, 0);

    table.append(thead,tbody); container.appendChild(table); body.appendChild(container);
    renderTableHeader(thead, table, key, title, arr);
    renderTableBody(tbody, table, key, arr);
    autoSizeFirstColumn(table);
    return section;
  }

  function entitySingular(key){ return key==='chambers'?'Chamber':key==='orifices'?'Orifice':key==='walls'?'Wall':'Entity'; }

  function renderTableHeader(thead, table, key, title, arr){
    var tr=document.createElement('tr');
    var control=document.createElement('th');
    control.className='column-header';
    control.style.cursor='pointer';
    control.innerHTML='<span class="tableHeaderToggle">▼</span>';
    control.onclick=function(){
      var icon=control.querySelector('.tableHeaderToggle');
      var collapsed=icon.textContent==='▼';
      icon.textContent=collapsed?'▶':'▼';
      table.querySelectorAll('tr').forEach(function(row){
        Array.prototype.slice.call(row.children).forEach(function(cell,idx){ if(idx>0) cell.style.display=collapsed?'none':''; });
      });
    };
    tr.appendChild(control);
    arr.forEach(function(_,i){
      var th=document.createElement('th'); th.textContent=entitySingular(key)+' '+(i+1); tr.appendChild(th);
    });
    thead.appendChild(tr);
    Array.prototype.slice.call(tr.children).forEach(function(_,idx){ if(idx>0) makeColumnResizable(table,idx); });
  }

  function uniqueFields(arr){
    var set=new Set();
    arr.forEach(function(obj){ if(obj && typeof obj==='object' && !Array.isArray(obj)) Object.keys(obj).forEach(function(k){set.add(k);}); });
    return Array.from(set);
  }

  function renderTableBody(tbody, table, key, arr){
    var q=(document.getElementById('tableSearchBox')?.value||'').toLowerCase().trim();
    uniqueFields(arr).forEach(function(field){
      var row=document.createElement('tr'); row.dataset.field=field;
      var rowText=field+' '+arr.map(function(o){return o&&o[field]!==undefined?JSON.stringify(o[field]):'';}).join(' ');
      if(q && rowText.toLowerCase().indexOf(q)<0) return;
      var label=document.createElement('td'); label.className='tableFieldLabel'; label.innerHTML='<span class="tableToggleIcon">▼</span>'+fmtField(field);
      label.onclick=function(){
        var icon=label.querySelector('.tableToggleIcon');
        var collapsed=icon.textContent==='▼';
        icon.textContent=collapsed?'▶':'▼';
        Array.prototype.slice.call(row.children).forEach(function(cell,idx){ if(idx>0) cell.style.display=collapsed?'none':''; });
      };
      row.appendChild(label);
      arr.forEach(function(obj,idx){
        var td=document.createElement('td');
        td.appendChild(createCellEditor(obj,field));
        row.appendChild(td);
      });
      tbody.appendChild(row);
    });
    enableRowDragWithJsonSync(tbody,arr);
  }

  function createCellEditor(obj,field){
    var div=document.createElement('div'); div.className='tableCellValue'; div.contentEditable='true';
    var has=obj && Object.prototype.hasOwnProperty.call(obj,field);
    var original=has?obj[field]:undefined;
    if(!has){ div.innerHTML='<span class="tableMissing">—</span>'; div.dataset.empty='1'; }
    else if(isNested(original)){ div.textContent=JSON.stringify(original,null,2); }
    else { div.textContent=String(original); }
    div.addEventListener('focus',function(){ if(div.dataset.empty==='1'){ div.textContent=''; delete div.dataset.empty; } });
    div.addEventListener('blur',function(){
      try{
        var txt=div.textContent;
        if(txt.trim()==='' && !has){ delete obj[field]; div.innerHTML='<span class="tableMissing">—</span>'; div.dataset.empty='1'; return; }
        obj[field]=parseCellText(txt, original);
        div.classList.remove('invalid');
        var st=document.getElementById('tableStatus'); if(st) st.textContent='Unapplied table changes';
      }catch(e){ div.classList.add('invalid'); var st=document.getElementById('tableStatus'); if(st){st.textContent=e.message; st.className='bad';} }
    });
    return div;
  }

  function makeColumnResizable(table,colIndex){
    var th=table.querySelector('thead tr th:nth-child('+(colIndex+1)+')'); if(!th) return;
    th.classList.add('tableResizable');
    if(th.querySelector('.tableColResizer')) return;
    var res=document.createElement('div'); res.className='tableColResizer'; th.appendChild(res);
    var startX=0,startW=0;
    res.addEventListener('mousedown',function(e){
      startX=e.pageX; startW=th.offsetWidth;
      function move(ev){ var w=Math.max(40,startW+(ev.pageX-startX)); table.querySelectorAll('tr').forEach(function(row){ var cell=row.children[colIndex]; if(cell) cell.style.width=w+'px'; }); }
      function up(){ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); }
      document.addEventListener('mousemove',move); document.addEventListener('mouseup',up); e.preventDefault(); e.stopPropagation();
    });
  }

  function enableRowDragWithJsonSync(tbody,dataArray){
    tbody.querySelectorAll('tr').forEach(function(row){
      if(!row.dataset.field) return;
      row.classList.add('tableDraggableRow'); row.draggable=true;
      row.addEventListener('dragstart',function(){ draggedTableRow=row; row.classList.add('tableDragging'); });
      row.addEventListener('dragend',function(){ draggedTableRow=null; row.classList.remove('tableDragging'); tbody.querySelectorAll('tr').forEach(function(r){r.classList.remove('tableDragOverTop','tableDragOverBottom');}); syncJsonKeyOrder(tbody,dataArray); });
      row.addEventListener('dragover',function(e){ e.preventDefault(); var r=row.getBoundingClientRect(), above=e.clientY<r.top+r.height/2; row.classList.toggle('tableDragOverTop',above); row.classList.toggle('tableDragOverBottom',!above); });
      row.addEventListener('dragleave',function(){ row.classList.remove('tableDragOverTop','tableDragOverBottom'); });
      row.addEventListener('drop',function(e){ e.preventDefault(); if(!draggedTableRow || draggedTableRow===row) return; var r=row.getBoundingClientRect(), above=e.clientY<r.top+r.height/2; row.classList.remove('tableDragOverTop','tableDragOverBottom'); tbody.insertBefore(draggedTableRow, above?row:row.nextSibling); });
    });
  }

  function syncJsonKeyOrder(tbody,dataArray){
    var order=Array.prototype.slice.call(tbody.querySelectorAll('tr')).map(function(r){return r.dataset.field;}).filter(Boolean);
    dataArray.forEach(function(obj){
      if(!obj || typeof obj!=='object' || Array.isArray(obj)) return;
      var reordered={};
      order.forEach(function(k){ if(Object.prototype.hasOwnProperty.call(obj,k)) reordered[k]=obj[k]; });
      Object.keys(obj).forEach(function(k){ if(!Object.prototype.hasOwnProperty.call(reordered,k)) reordered[k]=obj[k]; });
      Object.keys(obj).forEach(function(k){ delete obj[k]; });
      Object.assign(obj,reordered);
    });
    var st=document.getElementById('tableStatus'); if(st) st.textContent='Unapplied table row order changes';
  }

  function autoSizeFirstColumn(table){
    var max=90;
    table.querySelectorAll('td.tableFieldLabel').forEach(function(cell){ max=Math.max(max, Math.min(260, cell.textContent.length*8+28)); });
    table.querySelectorAll('tr').forEach(function(row){ if(row.children[0]) row.children[0].style.width=max+'px'; });
  }

  function applyTableChanges(){
    try{ fullJson=clone(tableWorkingCopy); refreshAllViews(); setStatus('JSON updated from Table viewer.', true); }
    catch(e){ setStatus('Table apply failed: '+e.message,false); }
  }

  var priorRefresh=window.refreshAllViews;
  window.refreshAllViews=function(){
    if(typeof priorRefresh==='function') priorRefresh();
    tableWorkingCopy = fullJson ? clone(fullJson) : null;
    renderTableViewer();
  };
  var priorSetTab=window.setTab;
  window.setTab=function(t){
    ensureTabAndPane();
    if(t==='table'){
      try{ currentTab='table'; }catch(e){}
      setActiveTab('table');
      if(!tableWorkingCopy && fullJson) tableWorkingCopy=clone(fullJson);
      renderTableViewer();
      return;
    }
    var out=typeof priorSetTab==='function'?priorSetTab(t):undefined;
    if(t==='tree' || t==='code') setActiveTab(t);
    return out;
  };

  window.renderTableViewer=renderTableViewer;

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ ensureTabAndPane(); tableWorkingCopy=fullJson?clone(fullJson):null; renderTableViewer(); });
  else { ensureTabAndPane(); tableWorkingCopy=fullJson?clone(fullJson):null; renderTableViewer(); }
  setTimeout(function(){ ensureTabAndPane(); renderTableViewer(); },0);
})();
