<div id="header">
  <div id="brandLeft">
    <img id="logo" src="Autoliv.png" />
    <div id="title">Inflator Model Viewer</div>
  </div>
  <div id="tagline">More Lives Saved – More Life Lived</div>
</div>

<div id="toolbar">
  <button class="btn" id="openBtn">Open JSON File</button>
  <button class="btn secondary" id="expandBtn">Expand All</button>
  <button class="btn secondary" id="collapseBtn">Collapse All</button>
  <div class="spacer"></div>
  <div class="field">
    <span>Search:</span>
    <input id="searchBox" />
  </div>
</div>

<div id="main">
  <div id="left">
    <div id="tabs">
      <div class="tab active" id="tabTree">Tree</div>
      <div class="tab" id="tabCode">Code</div>
    </div>
    <div id="treePane"></div>
    <div id="codePane" style="display:none;">
      <pre id="codePre"></pre>
    </div>
  </div>

  <div id="right">
    <div id="vizHeader">
      <div class="h">Assembly Flow</div>
    </div>
    <div id="vizWrap">
      <svg id="svg">
        <g id="edges"></g>
        <g id="nodes"></g>
      </svg>
    </div>
  </div>
</div>

<div id="status">
  <div id="statusLeft">Ready.</div>
  <div id="statusRight">OK</div>
</div>
