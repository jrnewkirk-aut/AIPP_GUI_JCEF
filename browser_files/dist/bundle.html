<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Autoliv | Inflator Model Viewer</title>
<style>

  :root{
    /* Brand palette (from manual) */
    --autoliv-blue:#005495;   /* primary brand color */ /* 【1-f5fa37】 */
    --autoliv-cyan:#009fe3;   /* complementary cyan */  /* 【1-f5fa37】 */
    --autoliv-dark:#163b77;   /* complementary dark */  /* 【1-f5fa37】 */
    --bg:#ffffff;
    --panel:#f5f6f7;
    --line:#d9d9d9;
    --text:#1a1a1a;
    --muted:#5b5b5b;
    --danger:#c80000;
    --ok:#147a1e;
  }

  html, body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:"Archivo", Arial, sans-serif; /* Archivo primary, Arial fallback */ /* 【1-f5fa37】 */
    overflow:hidden;
  }

  /* Header */
  #header{
    height:56px;
    background:var(--autoliv-blue);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    box-sizing:border-box;
  }
  #brandLeft{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:340px;
  }
  #logo{
    height:26px;
    width:auto;
    display:block;
  }
  #title{
    font-weight:600;
    font-size:15px;
    letter-spacing:0.2px;
    white-space:nowrap;
  }
  #tagline{
    font-size:12px;
    opacity:0.9;
    white-space:nowrap;
  }

  /* Toolbar */
  #toolbar{
    height:54px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    box-sizing:border-box;
  }
  .btn{
    background:var(--autoliv-blue);
    color:#fff;
    border:none;
    padding:9px 12px;
    border-radius:4px;
    cursor:pointer;
    font-weight:600;
    font-size:13px;
  }
  .btn:hover{ background:#00457c; }
  .btn.secondary{
    background:#ffffff;
    color:var(--autoliv-blue);
    border:1px solid rgba(0,84,149,0.35);
  }
  .btn.secondary:hover{ background:#f2f7ff; }
  .spacer{ flex:1; }

  .field{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--muted);
  }
  .field input{
    height:30px;
    width:260px;
    padding:0 10px;
    border:1px solid var(--line);
    border-radius:4px;
    outline:none;
    font-family:inherit;
  }

  /* Main layout */
  #main{
    height:calc(100% - 56px - 54px - 30px);
    display:flex;
    min-height:0;
  }
  #left{
    width:50%;
    border-right:2px solid #eee;
    display:flex;
    flex-direction:column;
    min-width:420px;
  }
  #right{
    width:50%;
    display:flex;
    flex-direction:column;
    min-width:420px;
  }

  /* Left: tabs */
  #tabs{
    height:40px;
    display:flex;
    align-items:flex-end;
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:0 10px;
    gap:6px;
    box-sizing:border-box;
  }
  .tab{
    padding:8px 10px;
    border:1px solid var(--line);
    border-bottom:none;
    border-top-left-radius:6px;
    border-top-right-radius:6px;
    background:#fafafa;
    cursor:pointer;
    font-weight:600;
    font-size:12px;
    color:#333;
  }
  .tab.active{
    background:#fff;
    color:var(--autoliv-blue);
  }

  #treePane, #codePane{
    flex:1;
    overflow:auto;
    padding:10px 12px;
    box-sizing:border-box;
    background:#fff;
  }

  /* Tree view */
  .node{
    font-size:13px;
    line-height:1.35;
    margin:2px 0;
  }
  .k{ color:#1f3b5c; font-weight:600; }
  .t{ color:#666; }
  .v-string{ color:#0b6b1e; }
  .v-number{ color:#2b4ddb; }
  .v-bool{ color:#b4009e; }
  .v-null{ color:#999; font-style:italic; }

  details{
    margin-left:14px;
  }
  summary{
    cursor:pointer;
    user-select:none;
    outline:none;
  }
  summary::-webkit-details-marker { display:none; }

  .summaryLine{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .caret{
    width:10px;
    height:10px;
    display:inline-block;
    border-right:2px solid #666;
    border-bottom:2px solid #666;
    transform:rotate(-45deg);
    margin-right:4px;
  }
  details[open] > summary .caret{
    transform:rotate(45deg);
  }

  /* Code view */
  pre{
    margin:0;
    padding:10px;
    background:#0f1720;
    color:#e6edf3;
    border-radius:8px;
    overflow:auto;
    font-family:Consolas, Menlo, Monaco, monospace;
    font-size:12px;
    line-height:1.5;
  }
  .hl-k{ color:#7dd3fc; }   /* keys */
  .hl-s{ color:#86efac; }   /* strings */
  .hl-n{ color:#93c5fd; }   /* numbers */
  .hl-b{ color:#fda4af; }   /* booleans/null */

  /* Right: flowchart */
  #vizHeader{
    height:40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding:0 12px;
    box-sizing:border-box;
    background:#fff;
  }
  #vizHeader .h{
    font-weight:600;
    color:var(--autoliv-blue);
    font-size:13px;
  }
  #vizHeader .hint{
    color:var(--muted);
    font-size:12px;
  }

  #vizWrap{
    flex:1;
    position:relative;
    background:#fff;
  }
  svg{ width:100%; height:100%; display:block; }

  .edge{
    stroke:#6b7280;
    stroke-width:1.5;
    opacity:0.95;
  }
  .edgeWall{
    stroke:#9aa3ad;
    stroke-dasharray:4 3;
  }

  .nodeChamber{ fill:var(--autoliv-blue); }
  .nodeOrifice{ fill:var(--autoliv-cyan); }
  .nodeWall{ fill:var(--autoliv-dark); }

  .label{
    fill:#fff;
    font-weight:600;
    font-size:12px;
    pointer-events:none;
  }
  .labelDark{
    fill:#0b1220;
    font-weight:700;
  }

  /* Status bar */
  #status{
    height:30px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    box-sizing:border-box;
    background:#fff;
    font-family:Consolas, Menlo, Monaco, monospace;
    font-size:12px;
  }
  #status .ok{ color:var(--ok); }
  #status .bad{ color:var(--danger); }
  #status .muted{ color:var(--muted); }

  /* Popup inspector (draggable + editable form) */
  #popup{
    position:absolute;
    top:90px;
    left:90px;
    width:520px;
    height:560px;
    background:#fff;
    border:2px solid var(--autoliv-blue);
    box-shadow:0 10px 30px rgba(0,0,0,0.22);
    display:none;
    z-index:1000;
  }
  #popupHeader{
    height:42px;
    background:var(--autoliv-blue);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    box-sizing:border-box;
    cursor:move;
    user-select:none;
    font-weight:600;
  }
  #popupBody{
    height:calc(100% - 42px - 50px);
    overflow:auto;
    padding:10px;
    box-sizing:border-box;
    background:#fff;
  }
  #popupFooter{
    height:50px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    box-sizing:border-box;
    background:#fafafa;
  }
  .xbtn{
    background:#fff;
    color:var(--autoliv-blue);
    border:none;
    border-radius:4px;
    padding:6px 10px;
    font-weight:800;
    cursor:pointer;
  }
  .smallBtn{
    background:var(--autoliv-blue);
    color:#fff;
    border:none;
    border-radius:4px;
    padding:8px 10px;
    font-weight:700;
    cursor:pointer;
  }
  .smallBtn.secondary{
    background:#fff;
    color:var(--autoliv-blue);
    border:1px solid rgba(0,84,149,0.35);
  }
  .smallBtn:hover{ filter:brightness(0.95); }

  /* Inspector form */
  .insGroup{
    border:1px solid #eee;
    border-radius:8px;
    margin:8px 0;
    overflow:hidden;
  }
  .insGroupHeader{
    background:#f6f8fb;
    padding:8px 10px;
    font-weight:700;
    color:#213547;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .insGroupBody{
    padding:8px 10px;
    display:block;
  }
  .row{
    display:flex;
    gap:10px;
    align-items:center;
    margin:6px 0;
  }
  .row .key{
    width:180px;
    font-weight:700;
    color:#1f3b5c;
    word-break:break-word;
  }
  .row .val{
    flex:1;
    min-width:0;
  }
  .row input, .row select, .row textarea{
    width:100%;
    box-sizing:border-box;
    padding:7px 8px;
    border:1px solid var(--line);
    border-radius:4px;
    font-family:inherit;
    font-size:13px;
  }
  .row textarea{ min-height:60px; resize:vertical; }
  .pill{
    font-size:11px;
    padding:2px 6px;
    border-radius:999px;
    border:1px solid #e3e3e3;
    color:#444;
    background:#fff;
  }

#codePane{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:0}#codeToolbar{min-height:42px;display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);background:#fafafa}#codeEditor{flex:1;width:100%;resize:none;border:0;outline:0;padding:10px;background:#0f1720;color:#e6edf3;font-family:Consolas,Menlo,Monaco,monospace;font-size:12px;line-height:1.5}.treePrimitiveRow{display:flex;gap:6px;flex-wrap:wrap}.edgeWall{stroke:#8a8a8a;stroke-dasharray:5 3}.smartSelect,.smartInput{width:100%;box-sizing:border-box;padding:7px 8px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:13px;background:#fff}.smartSelect{border-color:#005495;background:#f7fbff}.smartGroupBadge{font-size:11px;padding:2px 6px;border-radius:999px;border:1px solid rgba(0,84,149,.25);color:#005495;background:#eaf4ff}.smartInlinePair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.smartInlinePair .row{margin:0;display:grid;grid-template-columns:70px 1fr;gap:8px}.smartTable{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}.smartTable th{background:#f6f8fb;color:#005495;text-align:left;font-weight:700;border:1px solid var(--line);padding:5px 6px}.smartTable td{border:1px solid var(--line);padding:4px 5px}.smartTable input{width:100%;box-sizing:border-box;border:1px solid #e3e3e3;border-radius:3px;padding:5px 6px}.smartTableTools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.smartMiniBtn{background:#fff;color:#005495;border:1px solid rgba(0,84,149,.35);border-radius:4px;padding:6px 8px;font-weight:700;cursor:pointer;font-size:12px}.sumOk{color:#14a01e;font-weight:700}.sumWarn{color:#f3b100;font-weight:700}.sumBad{color:#ff0000;font-weight:700}.initFieldList{font-size:11px;color:var(--muted);padding:6px 8px;background:#f7fbff;border:1px solid rgba(0,84,149,.15);border-radius:4px;margin-top:6px}.flowZoomControls{position:absolute;right:14px;top:14px;display:flex;gap:6px;z-index:5;background:rgba(255,255,255,.94);border:1px solid #d0d0d0;border-radius:6px;padding:6px}.flowZoomControls button{font-family:Arial,sans-serif;font-weight:700;color:#005495;background:#fff;border:1px solid #d0d0d0;border-radius:4px;padding:4px 8px;cursor:pointer}.flowZoomHint{font-family:Arial,sans-serif;font-size:11px;color:#005495;align-self:center;padding:0 4px}.chamberCard{fill:#fff;stroke:#005495;stroke-width:3}.chamberTitleBand{fill:#005495}.chamberTitle{fill:#fff;font-family:Arial,sans-serif;font-weight:700;font-size:14px}.chamberVolumeBadge{fill:#009fe3;stroke:#005495;stroke-width:1.5}.chamberPanel{fill:#ededed;stroke:#d0d0d0;stroke-width:1.5}.chamberInfoText{fill:#005495;font-family:Arial,sans-serif;font-size:11px}.chamberInfoHeader{fill:#005495;font-family:Arial,sans-serif;font-size:12px;font-weight:700}.chamberBadgeText{fill:#001669;font-family:Arial,sans-serif;font-size:12px;font-weight:700}#popupHeader,#popupTitle{cursor:move;user-select:none}#popup{resize:both;overflow:auto}
</style>
</head>
<body>
<div id="header">
  <div id="brandLeft">
    <img id="logo" src="../Autoliv.png" alt="Autoliv" />
    <div id="title">Inflator Model Viewer</div>
  </div>
  <div id="tagline">More Lives Saved – More Life Lived</div>
</div>
<div id="toolbar">
  <button class="btn" onclick="selectFile()">Open JSON File</button>
  <button class="btn secondary" onclick="expandAll()">Expand All</button>
  <button class="btn secondary" onclick="collapseAll()">Collapse All</button>

  <div class="spacer"></div>

  <div class="field">
    <span>Search:</span>
    <input id="searchBox" placeholder="key / value..." oninput="renderTree()" />
  </div>
</div>
<div id="main">
  <div id="left">
    <div id="tabs">
      <div class="tab active" id="tabTree" onclick="setTab('tree')">Tree</div>
      <div class="tab" id="tabCode" onclick="setTab('code')">Code</div>
    </div>
    <div id="treePane"></div>
    <div id="codePane" style="display:none;">
      <div id="codeToolbar">
        <button class="smallBtn" onclick="applyCodeEdits()">Apply JSON</button>
        <button class="smallBtn secondary" onclick="resetCodeEditor()">Reset</button>
        <span id="codeError" class="bad"></span>
      </div>
      <textarea id="codeEditor" spellcheck="false"></textarea>
    </div>
  </div>

  <div id="right">
    <div id="vizHeader">
      <div class="h">Assembly Flow</div>
      <div class="hint">Double‑click any node to inspect & edit</div>
    </div>
    <div id="vizWrap">
      <svg id="svg" viewBox="0 0 1000 700" preserveAspectRatio="none">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L10,3 L0,6 Z" fill="#6b7280"></path>
          </marker>
        </defs>
        <g id="edges"></g>
        <g id="nodes"></g>
      </svg>
    </div>
  </div>
</div>
<div id="status">
  <div id="statusLeft" class="muted">Ready.</div>
  <div id="statusRight" class="ok">OK</div>
</div>
<!-- Draggable inspector -->
<div id="popup">
  <div id="popupHeader">
    <div id="popupTitle">Inspector</div>
    <button class="xbtn" onclick="closePopup()">X</button>
  </div>
  <div id="popupBody"></div>
  <div id="popupFooter">
    <span id="popupInfo" class="muted">Edits update the in‑memory model.</span>
    <div style="display:flex; gap:8px;">
      <button class="smallBtn secondary" onclick="revertPopup()">Revert</button>
      <button class="smallBtn" onclick="applyPopup()">Apply</button>
    </div>
  </div>
</div>
<script>
function toScilabMsg(obj){window.toScilab(JSON.stringify(obj));}
function selectFile(){toScilabMsg({type:"select_file"});}
function selectCsvFile(){toScilabMsg({type:"select_csv"});}
function asciiToString(arr){return arr.map(c=>String.fromCharCode(c)).join('');}
let fullJson=null,currentTab="tree",treeOpenAll=false,treeUserOpen=new Set();
let simNodes=[],simEdges=[],popupNode=null,popupPath=null,popupWorkingCopy=null,popupOriginalCopy=null,pendingCdCsvImport=null;
let flowViewBox={x:0,y:0,w:1000,h:700,base:null},flowPan={active:false,x:0,y:0,start:null};
let popupDrag={active:false,dx:0,dy:0};
const AIPP_CD_BASIS_OPTIONS=["constant","time","pressure"],AIPP_PRESSURE_UNITS=["MPa","kPa","Pa"],AIPP_TIME_UNITS=["s","ms"],STANDARD_SPECIES=["Ar","CO","CO2","H2","H2O","He","N2","N2O","O2"];
const CHAMBER_INIT_TYPES=["mPT","PVT","mVT","nVT","rho_mVT"],CHAMBER_INIT_FIELDS={mPT:["mass","pressure","temperature"],PVT:["pressure","volume","temperature"],mVT:["mass","volume","temperature"],nVT:["moles","volume","temperature"],rho_mVT:["density","volume","temperature"]};
const CHAMBER_INIT_DEFAULTS={mass:"0.0 g",pressure:"0.101325 MPa",temperature:"300.0 K",volume:"1.0 L",density:"0.0 kg/m^3",moles:"0.0 mol"};
const AIPP_CD_TEMPLATES={constant:{basis:"constant",Cd_value:0.7},time:{basis:"time",time_units:"s",time_array:[0.0,0.01],Cd_array:[0.75,0.5],continuity:"interpolate"},pressure:{basis:"pressure",pressure_units:"MPa",pressure_array:[25.0,50.0],Cd_array:[0.75,0.5],continuity:"discrete"}};
function makeDischargeCoefficientTemplate(b){return deepCopy(AIPP_CD_TEMPLATES[b]||AIPP_CD_TEMPLATES.constant);}function normalizeUnit(s){return String(s||"").trim().replaceAll(" ","").toLowerCase();}
function canonicalPressureUnit(s){const u=normalizeUnit(s);return u==="mpa"?"MPa":u==="kpa"?"kPa":u==="pa"?"Pa":null;}function canonicalTimeUnit(s){const u=normalizeUnit(s);return u==="s"?"s":u==="ms"?"ms":null;}function canonicalCdUnit(s){const u=normalizeUnit(s);return (u===""||u==="cd"||u==="1"||u==="dimensionless"||u==="unitless")?"Cd":null;}
function parseQuantityString(s,allowed,def){const m=String(s||"").match(/^\s*([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)\s*([A-Za-z]+)\s*$/);let value=0,unit=def;if(m){value=Number(m[1]);for(const u of allowed)if(normalizeUnit(u)===normalizeUnit(m[2]))unit=u;}return{value,unit};}function formatQuantity(v,u){return String(v)+" "+u;}function formatDouble(v){const n=Number(v);if(!Number.isFinite(n))return String(v);return Number.isInteger(n)?n.toFixed(1):String(n);}function truncText(s,n){s=String(s||"");return s.length>n?s.slice(0,n-1)+"…":s;}
function getEventSuggestions(){const out=["SimStart"],a=getAssemblyInfo(fullJson).assembly;if(!a)return out;if(Array.isArray(a.orifices))for(let i=0;i<a.orifices.length;i++)out.push("O"+(i+1)+"_opened","O"+(i+1)+"_closed");if(Array.isArray(a.chambers))for(let c=0;c<a.chambers.length;c++){const ps=a.chambers[c].pyro;if(Array.isArray(ps))for(let p=0;p<ps.length;p++)out.push("C"+(c+1)+"P"+(p+1)+"_ignited","C"+(c+1)+"P"+(p+1)+"_extinguished");}return out;}
function deepCopy(x){return JSON.parse(JSON.stringify(x));}function escapeHtml(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");}
function getJsonAtPath(path){let r=fullJson;for(const k of path){if(r==null)return undefined;r=r[k];}return r;}function setJsonAtPath(path,val){if(path.length===0)fullJson=val;else{let r=fullJson;for(let i=0;i<path.length-1;i++)r=r[path[i]];r[path[path.length-1]]=val;}refreshAllViews();}
function getPopupObjectAtPath(path){let r=popupWorkingCopy;for(const k of path){if(r==null)return null;r=r[k];}return r;}function getAssemblyInfo(j){if(j&&j.aipp_calculation&&j.aipp_calculation.assembly)return{assembly:j.aipp_calculation.assembly,basePath:["aipp_calculation","assembly"]};if(j&&j.assembly)return{assembly:j.assembly,basePath:["assembly"]};return{assembly:null,basePath:[]};}function refreshAllViews(){renderTree();updateCodeTextFromModel();buildGraph(fullJson);syncOpenPopupFromModel();}function setAtPath(path,val){let r=popupWorkingCopy;if(path.length===0){popupWorkingCopy=val;return;}for(let i=0;i<path.length-1;i++)r=r[path[i]];r[path[path.length-1]]=val;}function parseLoose(s){const t=String(s).trim();if(t==="null")return null;if(t==="true")return true;if(t==="false")return false;if(/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(t))return Number(t);return t;}

function setTab(tab){currentTab=tab;document.getElementById("tabTree").classList.toggle("active",tab==="tree");document.getElementById("tabCode").classList.toggle("active",tab==="code");document.getElementById("treePane").style.display=tab==="tree"?"block":"none";document.getElementById("codePane").style.display=tab==="code"?"flex":"none";if(tab==="code")updateCodeTextFromModel();}

function buildOpensAt(title,val,path){const g=document.createElement("div");g.className="insGroup";const h=document.createElement("div");h.className="insGroupHeader";h.innerHTML=`<span>${title}</span><span class="smartGroupBadge">smart opens_at editor</span>`;g.appendChild(h);const b=document.createElement("div");b.className="insGroupBody";g.appendChild(b);const mode=(val&&typeof val==="object")?"event":"pressure";b.appendChild(smartRow("opening_type",sel(["pressure","event"],mode,v=>{setAtPath(path,v==="pressure"?"20 MPa":{triggering_event:"SimStart",time_delay:"0 s"});renderInspector();})));if(mode==="pressure"){const q=parseQuantityString(val,AIPP_PRESSURE_UNITS,"MPa");b.appendChild(smartRow("pressure",inpNum(q.value,n=>setAtPath(path,formatQuantity(n,q.unit)))));b.appendChild(smartRow("pressure_units",sel(AIPP_PRESSURE_UNITS,q.unit,u=>{const cur=parseQuantityString(getPopupObjectAtPath(path),AIPP_PRESSURE_UNITS,u);setAtPath(path,formatQuantity(cur.value,u));})));}else{if(!val.triggering_event)val.triggering_event="SimStart";if(!val.time_delay)val.time_delay="0 s";const q=parseQuantityString(val.time_delay,AIPP_TIME_UNITS,"s");b.appendChild(smartRow("triggering_event",eventInput(val.triggering_event,v=>val.triggering_event=v)));b.appendChild(smartRow("time_delay",inpNum(q.value,n=>val.time_delay=formatQuantity(n,q.unit))));b.appendChild(smartRow("time_units",sel(AIPP_TIME_UNITS,q.unit,u=>{const cur=parseQuantityString(val.time_delay,AIPP_TIME_UNITS,u);val.time_delay=formatQuantity(cur.value,u);})));}return g;}function eventInput(value,cb){const wrap=document.createElement("div"),id="eventSuggestions_"+Math.random().toString(36).slice(2),inp=document.createElement("input"),dl=document.createElement("datalist");inp.className="smartInput";inp.value=value||"SimStart";inp.setAttribute("list",id);inp.addEventListener("input",()=>cb(inp.value));dl.id=id;getEventSuggestions().forEach(ev=>{const o=document.createElement("option");o.value=ev;dl.appendChild(o);});wrap.appendChild(inp);wrap.appendChild(dl);return wrap;}
function buildMolEditor(title,obj,path){const g=document.createElement("div");g.className="insGroup";const h=document.createElement("div");h.className="insGroupHeader";h.innerHTML=`<span>${title}</span><span class="smartGroupBadge">smart mole fraction editor</span>`;g.appendChild(h);const b=document.createElement("div");b.className="insGroupBody";g.appendChild(b);const rows=STANDARD_SPECIES.slice();Object.keys(obj).sort().forEach(k=>{if(!rows.includes(k))rows.push(k);});const tbl=document.createElement("table");tbl.className="smartTable";tbl.innerHTML='<thead><tr><th>Species</th><th>Mole Fraction</th><th></th></tr></thead>';const tb=document.createElement("tbody");rows.forEach(sp=>{const custom=!STANDARD_SPECIES.includes(sp),tr=document.createElement("tr"),tdS=document.createElement("td"),tdV=document.createElement("td"),tdB=document.createElement("td");if(custom){const s=document.createElement("input");s.value=sp;s.addEventListener("change",()=>{const n=s.value.trim();if(!n||rows.includes(n)){s.value=sp;return;}const val=obj[sp]||0;delete obj[sp];obj[n]=val||0.0;renderInspector();});tdS.appendChild(s);}else tdS.textContent=sp;const v=document.createElement("input");v.type="number";v.step="any";v.value=formatDouble(obj[sp]||0);v.addEventListener("input",()=>{const n=Number(v.value);if(Number.isNaN(n))return;if(Math.abs(n)===0)delete obj[sp];else obj[sp]=n;updateMolSum(b,obj);});tdV.appendChild(v);if(custom){const rm=document.createElement("button");rm.className="smartMiniBtn";rm.type="button";rm.textContent="Remove";rm.addEventListener("click",()=>{delete obj[sp];renderInspector();});tdB.appendChild(rm);}tr.appendChild(tdS);tr.appendChild(tdV);tr.appendChild(tdB);tb.appendChild(tr);});tbl.appendChild(tb);b.appendChild(tbl);const tools=document.createElement("div");tools.className="smartTableTools";addToolButton(tools,"Add Species",()=>{let base="CustomSpecies",name=base,i=1;while(Object.prototype.hasOwnProperty.call(obj,name)||STANDARD_SPECIES.includes(name)){i++;name=base+i;}obj[name]=0.0;renderInspector();});addToolButton(tools,"Normalize to 1.0",()=>{const s=sumMol(obj);if(s>0){for(const k of Object.keys(obj))obj[k]=obj[k]/s;}cleanMolObject(obj);renderInspector();});b.appendChild(tools);const sm=document.createElement("div");sm.id="molFracSum";sm.className="smartHint";b.appendChild(sm);updateMolSum(b,obj);return g;}function sumMol(o){let s=0;for(const k of Object.keys(o)){const n=Number(o[k]);if(Number.isFinite(n)&&Math.abs(n)>0)s+=n;}return s;}function cleanMolObject(o){for(const k of Object.keys(o)){const n=Number(o[k]);if(!Number.isFinite(n)||Math.abs(n)===0)delete o[k];}}function updateMolSum(c,o){const el=c.querySelector('#molFracSum');if(!el)return;const s=sumMol(o),err=Math.abs(s-1),cls=err<1e-8?'sumOk':err<1e-3?'sumWarn':'sumBad';el.innerHTML=`Sum = <span class="${cls}">${formatDouble(s)}</span> ${err<1e-8?'(OK)':'(should be 1.0)'} — JSON will include non-zero species only.`;}function cleanMolFractionsDeep(o){if(!o||typeof o!=="object")return;if(o.mol_fractions&&typeof o.mol_fractions==="object"&&!Array.isArray(o.mol_fractions))cleanMolObject(o.mol_fractions);for(const k of Object.keys(o))cleanMolFractionsDeep(o[k]);}
function buildChamberInitEditor(ch,path){const g=document.createElement("div");g.className="insGroup";const h=document.createElement("div");h.className="insGroupHeader";h.innerHTML='<span>chamber_initialization</span><span class="smartGroupBadge">smart init_type editor</span>';g.appendChild(h);const b=document.createElement("div");b.className="insGroupBody";g.appendChild(b);let init=CHAMBER_INIT_TYPES.includes(ch.init_type)?ch.init_type:"mPT";if(!ch.init_type)ch.init_type=init;ensureChamberInitFields(ch,init);b.appendChild(smartRow("init_type",sel(CHAMBER_INIT_TYPES,init,v=>{ch.init_type=v;cleanupChamberInitFields(ch,v);ensureChamberInitFields(ch,v);renderInspector();setStatus("Chamber init_type changed to "+v+". Click Apply to commit.",true);})));const req=CHAMBER_INIT_FIELDS[init]||[];for(const f of req)b.appendChild(smartRow(f,inpText(ch[f]??CHAMBER_INIT_DEFAULTS[f]??"",v=>{ch[f]=v;})));const msg=document.createElement("div");msg.className="initFieldList";msg.textContent="Required for "+init+": "+req.concat(["mol_fractions"]).join(", ")+". Changing init_type removes unused initialization fields.";b.appendChild(msg);return g;}function ensureChamberInitFields(ch,init){if(!ch.mol_fractions||typeof ch.mol_fractions!=="object"||Array.isArray(ch.mol_fractions))ch.mol_fractions={};for(const f of CHAMBER_INIT_FIELDS[init]||[]){if(ch[f]===undefined)ch[f]=CHAMBER_INIT_DEFAULTS[f]||"";}}function cleanupChamberInitFields(ch,init){const keep=new Set(CHAMBER_INIT_FIELDS[init]||[]);for(const f of ["mass","pressure","volume","density","moles","temperature"]){if(!keep.has(f))delete ch[f];}}
function requestCdCsvImport(path,mode){pendingCdCsvImport={path:path.slice(),mode};selectCsvFile();}function applyCdCsvText(csvText){if(!pendingCdCsvImport)return;const target=getPopupObjectAtPath(pendingCdCsvImport.path),parsed=parseTwoColumnCsv(csvText);if(!parsed.ok){alert(parsed.message);return;}const mode=pendingCdCsvImport.mode,xKey=mode==="pressure"?"pressure_array":"time_array",uKey=mode==="pressure"?"pressure_units":"time_units",csvU=mode==="pressure"?canonicalPressureUnit(parsed.unit1):canonicalTimeUnit(parsed.unit1),exp=mode==="pressure"?canonicalPressureUnit(target[uKey]):canonicalTimeUnit(target[uKey]);if(!csvU||csvU!==exp){alert(`CSV unit mismatch.\n\nExpected ${mode} units: ${exp}\nCSV ${mode} units: ${csvU||parsed.unit1}`);return;}if(!canonicalCdUnit(parsed.unit2)){alert("CSV Cd column unit is not recognized.");return;}target[xKey]=parsed.col1;target.Cd_array=parsed.col2;pendingCdCsvImport=null;renderInspector();}function parseTwoColumnCsv(text){const rows=text.replace(/\r/g,"").split("\n").map(r=>r.trim()).filter(Boolean);if(rows.length<2)return{ok:false,message:"CSV must include units row and data."};const data=rows.map(r=>r.split(',')),c1=[],c2=[];for(let i=1;i<data.length;i++){const a=Number(data[i][0]),b=Number(data[i][1]);if(Number.isNaN(a)||Number.isNaN(b))return{ok:false,message:"CSV row "+(i+1)+" contains nonnumeric data."};c1.push(a);c2.push(b);}return{ok:true,unit1:data[0][0].trim(),unit2:(data[0][1]||"").trim(),col1:c1,col2:c2};}
function fromScilab(msg){try{const o=JSON.parse(msg);if(o.type==="json_ascii"){fullJson=JSON.parse(asciiToString(o.data));refreshAllViews();setStatus("JSON loaded successfully.",true);}else if(o.type==="csv_ascii")applyCdCsvText(asciiToString(o.data));else setStatus("Unknown message type: "+o.type,false);}catch(e){setStatus("Failed to parse message: "+e.message,false);}}
window.onload=function(){renderTree();updateCodeTextFromModel();attachCodeEditorHandlers();initFlowZoomControls();initPopupDrag();setStatus("Ready. Click Open JSON File.",true);window.toScilab("loaded");};
</script>
