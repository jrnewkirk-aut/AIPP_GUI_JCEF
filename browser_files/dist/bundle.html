<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Autoliv | Inflator Model Viewer</title>
<style>
:root{
    /* Brand palette (from manual) */
    --autoliv-blue:#005495;   /* primary brand color */ /* 【1-f5fa37】 */
    --autoliv-cyan:#009fe3;   /* complementary cyan */  /* 【1-f5fa37】 */
    --autoliv-dark:#163b77;   /* complementary dark */  /* 【1-f5fa37】 */
    --bg:#ffffff;
    --panel:#f5f6f7;
    --line:#d9d9d9;
    --text:#1a1a1a;
    --muted:#5b5b5b;
    --danger:#c80000;
    --ok:#147a1e;
  }

  html, body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:"Archivo", Arial, sans-serif; /* Archivo primary, Arial fallback */ /* 【1-f5fa37】 */
    overflow:hidden;
  }

  /* Header */
  #header{
    height:56px;
    background:var(--autoliv-blue);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    box-sizing:border-box;
  }
  #brandLeft{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:340px;
  }
  #logo{
    height:26px;
    width:auto;
    display:block;
  }
  #title{
    font-weight:600;
    font-size:15px;
    letter-spacing:0.2px;
    white-space:nowrap;
  }
  #tagline{
    font-size:12px;
    opacity:0.9;
    white-space:nowrap;
  }

  /* Toolbar */
  #toolbar{
    height:54px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    box-sizing:border-box;
  }
  .btn{
    background:var(--autoliv-blue);
    color:#fff;
    border:none;
    padding:9px 12px;
    border-radius:4px;
    cursor:pointer;
    font-weight:600;
    font-size:13px;
  }
  .btn:hover{ background:#00457c; }
  .btn.secondary{
    background:#ffffff;
    color:var(--autoliv-blue);
    border:1px solid rgba(0,84,149,0.35);
  }
  .btn.secondary:hover{ background:#f2f7ff; }
  .spacer{ flex:1; }

  .field{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--muted);
  }
  .field input{
    height:30px;
    width:260px;
    padding:0 10px;
    border:1px solid var(--line);
    border-radius:4px;
    outline:none;
    font-family:inherit;
  }

  /* Main layout */
  #main{
    height:calc(100% - 56px - 54px - 30px);
    display:flex;
    min-height:0;
  }
  #left{
    width:50%;
    border-right:2px solid #eee;
    display:flex;
    flex-direction:column;
    min-width:420px;
  }
  #right{
    width:50%;
    display:flex;
    flex-direction:column;
    min-width:420px;
  }

  /* Left: tabs */
  #tabs{
    height:40px;
    display:flex;
    align-items:flex-end;
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:0 10px;
    gap:6px;
    box-sizing:border-box;
  }
  .tab{
    padding:8px 10px;
    border:1px solid var(--line);
    border-bottom:none;
    border-top-left-radius:6px;
    border-top-right-radius:6px;
    background:#fafafa;
    cursor:pointer;
    font-weight:600;
    font-size:12px;
    color:#333;
  }
  .tab.active{
    background:#fff;
    color:var(--autoliv-blue);
  }

  #treePane, #codePane{
    flex:1;
    overflow:auto;
    padding:10px 12px;
    box-sizing:border-box;
    background:#fff;
  }

  /* Tree view */
  .node{
    font-size:13px;
    line-height:1.35;
    margin:2px 0;
  }
  .k{ color:#1f3b5c; font-weight:600; }
  .t{ color:#666; }
  .v-string{ color:#0b6b1e; }
  .v-number{ color:#2b4ddb; }
  .v-bool{ color:#b4009e; }
  .v-null{ color:#999; font-style:italic; }

  details{
    margin-left:14px;
  }
  summary{
    cursor:pointer;
    user-select:none;
    outline:none;
  }
  summary::-webkit-details-marker { display:none; }

  .summaryLine{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .caret{
    width:10px;
    height:10px;
    display:inline-block;
    border-right:2px solid #666;
    border-bottom:2px solid #666;
    transform:rotate(-45deg);
    margin-right:4px;
  }
  details[open] > summary .caret{
    transform:rotate(45deg);
  }

  /* Code view */
  pre{
    margin:0;
    padding:10px;
    background:#0f1720;
    color:#e6edf3;
    border-radius:8px;
    overflow:auto;
    font-family:Consolas, Menlo, Monaco, monospace;
    font-size:12px;
    line-height:1.5;
  }
  .hl-k{ color:#7dd3fc; }   /* keys */
  .hl-s{ color:#86efac; }   /* strings */
  .hl-n{ color:#93c5fd; }   /* numbers */
  .hl-b{ color:#fda4af; }   /* booleans/null */

  /* Right: flowchart */
  #vizHeader{
    height:40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding:0 12px;
    box-sizing:border-box;
    background:#fff;
  }
  #vizHeader .h{
    font-weight:600;
    color:var(--autoliv-blue);
    font-size:13px;
  }
  #vizHeader .hint{
    color:var(--muted);
    font-size:12px;
  }

  #vizWrap{
    flex:1;
    position:relative;
    background:#fff;
  }
  svg{ width:100%; height:100%; display:block; }

  .edge{
    stroke:#6b7280;
    stroke-width:1.5;
    opacity:0.95;
  }
  .edgeWall{
    stroke:#9aa3ad;
    stroke-dasharray:4 3;
  }

  .nodeChamber{ fill:var(--autoliv-blue); }
  .nodeOrifice{ fill:var(--autoliv-cyan); }
  .nodeWall{ fill:var(--autoliv-dark); }

  .label{
    fill:#fff;
    font-weight:600;
    font-size:12px;
    pointer-events:none;
  }
  .labelDark{
    fill:#0b1220;
    font-weight:700;
  }

  /* Status bar */
  #status{
    height:30px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    box-sizing:border-box;
    background:#fff;
    font-family:Consolas, Menlo, Monaco, monospace;
    font-size:12px;
  }
  #status .ok{ color:var(--ok); }
  #status .bad{ color:var(--danger); }
  #status .muted{ color:var(--muted); }

  /* Popup inspector (draggable + editable form) */
  #popup{
    position:absolute;
    top:90px;
    left:90px;
    width:520px;
    height:560px;
    background:#fff;
    border:2px solid var(--autoliv-blue);
    box-shadow:0 10px 30px rgba(0,0,0,0.22);
    display:none;
    z-index:1000;
  }
  #popupHeader{
    height:42px;
    background:var(--autoliv-blue);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    box-sizing:border-box;
    cursor:move;
    user-select:none;
    font-weight:600;
  }
  #popupBody{
    height:calc(100% - 42px - 50px);
    overflow:auto;
    padding:10px;
    box-sizing:border-box;
    background:#fff;
  }
  #popupFooter{
    height:50px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    box-sizing:border-box;
    background:#fafafa;
  }
  .xbtn{
    background:#fff;
    color:var(--autoliv-blue);
    border:none;
    border-radius:4px;
    padding:6px 10px;
    font-weight:800;
    cursor:pointer;
  }
  .smallBtn{
    background:var(--autoliv-blue);
    color:#fff;
    border:none;
    border-radius:4px;
    padding:8px 10px;
    font-weight:700;
    cursor:pointer;
  }
  .smallBtn.secondary{
    background:#fff;
    color:var(--autoliv-blue);
    border:1px solid rgba(0,84,149,0.35);
  }
  .smallBtn:hover{ filter:brightness(0.95); }

  /* Inspector form */
  .insGroup{
    border:1px solid #eee;
    border-radius:8px;
    margin:8px 0;
    overflow:hidden;
  }
  .insGroupHeader{
    background:#f6f8fb;
    padding:8px 10px;
    font-weight:700;
    color:#213547;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .insGroupBody{
    padding:8px 10px;
    display:block;
  }
  .row{
    display:flex;
    gap:10px;
    align-items:center;
    margin:6px 0;
  }
  .row .key{
    width:180px;
    font-weight:700;
    color:#1f3b5c;
    word-break:break-word;
  }
  .row .val{
    flex:1;
    min-width:0;
  }
  .row input, .row select, .row textarea{
    width:100%;
    box-sizing:border-box;
    padding:7px 8px;
    border:1px solid var(--line);
    border-radius:4px;
    font-family:inherit;
    font-size:13px;
  }
  .row textarea{ min-height:60px; resize:vertical; }
  .pill{
    font-size:11px;
    padding:2px 6px;
    border-radius:999px;
    border:1px solid #e3e3e3;
    color:#444;
    background:#fff;
  }
</style>
</head>
<body>
<div id="header">
  <div id="brandLeft">
    <img id="logo" src="../Autoliv.png" alt="Autoliv" />
    <div id="title">Inflator Model Viewer</div>
  </div>
  <div id="tagline">More Lives Saved – More Life Lived</div>
</div>
<div id="toolbar">
  <button class="btn" onclick="selectFile()">Open JSON File</button>
  <button class="btn secondary" onclick="expandAll()">Expand All</button>
  <button class="btn secondary" onclick="collapseAll()">Collapse All</button>

  <div class="spacer"></div>

  <div class="field">
    <span>Search:</span>
    <input id="searchBox" placeholder="key / value..." oninput="renderTree()" />
  </div>
</div>
<div id="main">
  <div id="left">
    <div id="tabs">
      <div class="tab active" id="tabTree" onclick="setTab('tree')">Tree</div>
      <div class="tab" id="tabCode" onclick="setTab('code')">Code</div>
    </div>
    <div id="treePane"></div>
    <div id="codePane" style="display:none;"><pre id="codePre"></pre></div>
  </div>

  <div id="right">
    <div id="vizHeader">
      <div class="h">Assembly Flow</div>
      <div class="hint">Double‑click any node to inspect & edit</div>
    </div>
    <div id="vizWrap">
      <svg id="svg" viewBox="0 0 1000 700" preserveAspectRatio="none">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L10,3 L0,6 Z" fill="#6b7280"></path>
          </marker>
        </defs>
        <g id="edges"></g>
        <g id="nodes"></g>
      </svg>
    </div>
  </div>
</div>
<div id="status">
  <div id="statusLeft" class="muted">Ready.</div>
  <div id="statusRight" class="ok">OK</div>
</div>
<!-- Draggable inspector -->
<div id="popup">
  <div id="popupHeader">
    <div id="popupTitle">Inspector</div>
    <button class="xbtn" onclick="closePopup()">X</button>
  </div>
  <div id="popupBody"></div>
  <div id="popupFooter">
    <span id="popupInfo" class="muted">Edits update the in‑memory model.</span>
    <div style="display:flex; gap:8px;">
      <button class="smallBtn secondary" onclick="revertPopup()">Revert</button>
      <button class="smallBtn" onclick="applyPopup()">Apply</button>
    </div>
  </div>
</div>
<script>
/* ============================================================
   Scilab comm
   ============================================================ */
function toScilabMsg(obj){
  const s = JSON.stringify(obj);
  window.toScilab(s);
}
function selectFile(){
  toScilabMsg({type:"select_file"});
}
function asciiToString(arr){
  return arr.map(c => String.fromCharCode(c)).join('');
}
/* ============================================================
   App state
   ============================================================ */
let fullJson = null;
let currentTab = "tree";

let treeOpenAll = false;
let treeUserOpen = new Set();   // remember open paths when not global expand

// visualization state
let simNodes = []; // {id,type,label,x,y,fx,fy,data}
let simEdges = []; // {a,b,type,label}
let raf = null;

// popup state
let popupNode = null;
let popupWorkingCopy = null;
let popupOriginalCopy = null;
/* ============================================================
   Status
   ============================================================ */
function setStatus(msg, ok){
  document.getElementById("statusLeft").textContent = msg;
  const r = document.getElementById("statusRight");
  r.textContent = ok ? "OK" : "ERROR";
  r.className = ok ? "ok" : "bad";
}
/* ============================================================
   Tabs
   ============================================================ */
function setTab(tab){
  currentTab = tab;
  document.getElementById("tabTree").classList.toggle("active", tab==="tree");
  document.getElementById("tabCode").classList.toggle("active", tab==="code");
  document.getElementById("treePane").style.display = (tab==="tree") ? "block" : "none";
  document.getElementById("codePane").style.display = (tab==="code") ? "block" : "none";
  if (tab === "code") renderCode();
}
/* ============================================================
   Tree rendering (collapsible + search)
   ============================================================ */
function expandAll(){ treeOpenAll = true; renderTree(); }
function collapseAll(){ treeOpenAll = false; treeUserOpen.clear(); renderTree(); }

function matchSearch(text){
  const q = (document.getElementById("searchBox").value || "").trim().toLowerCase();
  if (!q) return true;
  return String(text).toLowerCase().includes(q);
}

function isObject(x){ return x && typeof x === "object" && !Array.isArray(x); }

function fmtValue(v){
  if (v === null) return '<span class="v-null">null</span>';
  if (typeof v === "string") return '<span class="v-string">"' + escapeHtml(v) + '"</span>';
  if (typeof v === "number") return '<span class="v-number">' + v + '</span>';
  if (typeof v === "boolean") return '<span class="v-bool">' + v + '</span>';
  return '<span class="t">' + escapeHtml(String(v)) + '</span>';
}

function escapeHtml(s){
  return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function shouldOpen(path){
  if (treeOpenAll) return true;
  return treeUserOpen.has(path);
}

function togglePath(path, open){
  if (open) treeUserOpen.add(path);
  else treeUserOpen.delete(path);
}

function renderTree(){
  const pane = document.getElementById("treePane");
  if (!fullJson){
    pane.innerHTML = '<div class="node t">Load a JSON file to view contents.</div>';
    return;
  }
  const html = renderNode(fullJson, "root", 0);
  pane.innerHTML = html || '<div class="node t">No matches.</div>';

  // attach listeners to details toggles
  pane.querySelectorAll("details[data-path]").forEach(d=>{
    d.addEventListener("toggle", ()=>{
      togglePath(d.getAttribute("data-path"), d.open);
    });
    d.open = shouldOpen(d.getAttribute("data-path"));
  });
}

function renderNode(value, path, depth, keyName){
  // Search: include node if it matches itself or any child matches
  const matchesSelf = matchSearch(keyName || "") || matchSearch(value === null ? "null" : (typeof value === "object" ? "" : value));

  // Primitive
  if (value === null || typeof value !== "object"){
    if (!matchesSelf) return "";
    const k = keyName !== undefined ? '<span class="k">' + escapeHtml(keyName) + '</span>: ' : "";
    return '<div class="node">' + k + fmtValue(value) + '</div>';
  }

  // Arrays / Objects
  const isArr = Array.isArray(value);
  const keys = isArr ? value.map((_,i)=>String(i)) : Object.keys(value);

  let childHtml = "";
  for (const k of keys){
    const child = isArr ? value[Number(k)] : value[k];
    const p = path + "." + k;
    childHtml += renderNode(child, p, depth+1, k);
  }

  // If no child matches and self doesn't match, hide
  if (!childHtml && !matchesSelf) return "";

  const labelKey = (keyName !== undefined) ? ('<span class="k">' + escapeHtml(keyName) + '</span>') : '<span class="k">root</span>';
  const badge = isArr ? ('<span class="pill">array[' + value.length + ']</span>') : ('<span class="pill">object{' + keys.length + '}</span>');

  return `
    <details class="node" data-path="${escapeHtml(path)}">
      <summary>
        <div class="summaryLine">
          <span class="caret"></span>
          ${labelKey} <span class="t">:</span> ${badge}
        </div>
      </summary>
      <div style="margin-left:14px;">
        ${childHtml}
      </div>
    </details>
  `;
}
/* ============================================================
   Code view with simple syntax highlighting
   ============================================================ */
function renderCode(){
  if (!fullJson){
    document.getElementById("codePre").textContent = "";
    return;
  }
  const raw = JSON.stringify(fullJson, null, 2);
  document.getElementById("codePre").innerHTML = highlightJson(raw);
}

function highlightJson(s){
  // Escape HTML first
  let t = escapeHtml(s);

  // Highlight keys: "key":
  t = t.replace(/&quot;([^&]|&amp;|&lt;|&gt;)*?&quot;(?=\s*:)/g, (m)=>'<span class="hl-k">'+m+'</span>');

  // Highlight strings (remaining quoted)
  t = t.replace(/&quot;([^&]|&amp;|&lt;|&gt;)*?&quot;/g, (m)=>'<span class="hl-s">'+m+'</span>');

  // Highlight numbers
  t = t.replace(/\b-?\d+(\.\d+)?([eE][+-]?\d+)?\b/g, (m)=>'<span class="hl-n">'+m+'</span>');

  // Highlight booleans/null
  t = t.replace(/\b(true|false|null)\b/g, (m)=>'<span class="hl-b">'+m+'</span>');

  return t;
}
/* ============================================================
   Flowchart visualization (SVG + simple force layout)
   Nodes: chambers (ellipse), orifices (rect), walls (diamond)
   No "Env" nodes (per request)
   ============================================================ */
function buildGraph(parsed){
  simNodes = [];
  simEdges = [];

  const assembly = (parsed && parsed.aipp_calculation && parsed.aipp_calculation.assembly) ? parsed.aipp_calculation.assembly : parsed.assembly;
  if (!assembly || !assembly.chambers){
    clearSvg();
    setStatus("No assembly/chambers found for visualization.", false);
    return;
  }

  // Chambers as base nodes (id = "c1", "c2"...)
  for (let i=0;i<assembly.chambers.length;i++){
    simNodes.push({
      id:"c"+(i+1),
      type:"chamber",
      label:"Ch "+(i+1),
      x:150 + i*180,
      y:260 + (i%2)*40,
      data:assembly.chambers[i]
    });
  }

  // Orifices as nodes (id = "o1"...), edges chamber->orifice->chamber
  if (assembly.orifices){
    for (let i=0;i<assembly.orifices.length;i++){
      const o = assembly.orifices[i];
      const from = parseInt(o.from);
      const to = parseInt(o.to);
      if (!from || !to) continue;

      const oid = "o"+(i+1);
      const midX = (getNode("c"+from).x + getNode("c"+to).x)/2;
      const midY = (getNode("c"+from).y + getNode("c"+to).y)/2;

      simNodes.push({
        id:oid,
        type:"orifice",
        label:"Orf "+(i+1),
        x:midX,
        y:midY - 70,
        data:o
      });

      simEdges.push({a:"c"+from, b:oid, type:"flow"});
      simEdges.push({a:oid, b:"c"+to, type:"flow"});
    }
  }

  // Walls as nodes (id = "w1"...), connect to chambers based on chamber_index fields only
  if (assembly.walls){
    for (let i=0;i<assembly.walls.length;i++){
      const w = assembly.walls[i];
      const wid = "w"+(i+1);

      // place walls near their left chamber if possible
      let anchor = null;
      if (w.left_connection && w.left_connection.chamber_index){
        anchor = getNode("c"+w.left_connection.chamber_index);
      } else if (w.right_connection && w.right_connection.chamber_index){
        anchor = getNode("c"+w.right_connection.chamber_index);
      }

      simNodes.push({
        id:wid,
        type:"wall",
        label:"Wall "+(i+1),
        x: anchor ? (anchor.x - 70) : (120 + i*90),
        y: anchor ? (anchor.y + 120) : (460),
        data:w
      });

      if (w.left_connection && w.left_connection.chamber_index){
        simEdges.push({a:"c"+w.left_connection.chamber_index, b:wid, type:"wall"});
      }
      if (w.right_connection && w.right_connection.chamber_index){
        simEdges.push({a:wid, b:"c"+w.right_connection.chamber_index, type:"wall"});
      }
      // If right_connection is environment (no chamber_index), we do nothing (no env nodes).
    }
  }

  // run a short force layout to spread nodes and avoid overlaps
  runForceLayout(220);
  drawSvg();

  setStatus(`Loaded ${simNodes.length} nodes, ${simEdges.length} links.`, true);
}

function getNode(id){
  const n = simNodes.find(x=>x.id===id);
  return n || {x:500,y:350};
}

function clearSvg(){
  document.getElementById("edges").innerHTML = "";
  document.getElementById("nodes").innerHTML = "";
}

function runForceLayout(iter){
  // Basic repulsion + spring attraction
  const kRepel = 4800;
  const kSpring = 0.02;
  const springLen = 150;
  const damp = 0.85;

  // velocities
  for (const n of simNodes){ n.vx = 0; n.vy = 0; }

  for (let t=0;t<iter;t++){
    // repulsion
    for (let i=0;i<simNodes.length;i++){
      for (let j=i+1;j<simNodes.length;j++){
        const a = simNodes[i], b = simNodes[j];
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const d2 = dx*dx + dy*dy + 0.01;
        const f = kRepel / d2;
        const fx = f * dx;
        const fy = f * dy;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
      }
    }

    // springs
    for (const e of simEdges){
      const a = getNode(e.a), b = getNode(e.b);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.sqrt(dx*dx + dy*dy) + 0.01;
      const diff = d - springLen;
      const f = kSpring * diff;
      const fx = f * (dx/d);
      const fy = f * (dy/d);
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    }

    // integrate
    for (const n of simNodes){
      n.vx *= damp; n.vy *= damp;
      n.x += n.vx * 0.0012;
      n.y += n.vy * 0.0012;

      // bounds
      n.x = Math.max(60, Math.min(940, n.x));
      n.y = Math.max(60, Math.min(640, n.y));
    }
  }
}

function drawSvg(){
  clearSvg();

  // edges
  const edgesG = document.getElementById("edges");
  for (const e of simEdges){
    const a = getNode(e.a), b = getNode(e.b);
    const cls = (e.type === "wall") ? "edge edgeWall" : "edge";
    const arrow = (e.type === "flow") ? ' marker-end="url(#arrow)" ' : '';
    edgesG.insertAdjacentHTML("beforeend",
      `<line class="${cls}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" ${arrow}></line>`
    );
  }

  // nodes
  const nodesG = document.getElementById("nodes");
  for (const n of simNodes){
    nodesG.insertAdjacentHTML("beforeend", nodeSvg(n));
  }

  // attach dblclick handlers
  simNodes.forEach(n=>{
    const el = document.getElementById("node_"+n.id);
    if (!el) return;
    el.addEventListener("dblclick", (evt)=>{
      evt.preventDefault();
      evt.stopPropagation();
      openPopup(n);
    });
  });
}

function nodeSvg(n){
  // Use different shapes
  if (n.type === "chamber"){
    return `
      <g id="node_${n.id}" style="cursor:pointer;">
        <ellipse class="nodeChamber" cx="${n.x}" cy="${n.y}" rx="52" ry="26"></ellipse>
        <text class="label" x="${n.x}" y="${n.y+4}" text-anchor="middle">${escapeHtml(n.label)}</text>
      </g>
    `;
  }
  if (n.type === "orifice"){
    return `
      <g id="node_${n.id}" style="cursor:pointer;">
        <rect class="nodeOrifice" x="${n.x-46}" y="${n.y-18}" width="92" height="36" rx="6"></rect>
        <text class="label labelDark" x="${n.x}" y="${n.y+4}" text-anchor="middle">${escapeHtml(n.label)}</text>
      </g>
    `;
  }
  // wall (diamond)
  return `
    <g id="node_${n.id}" style="cursor:pointer;">
      <path class="nodeWall" d="
        M ${n.x} ${n.y-24}
        L ${n.x+30} ${n.y}
        L ${n.x} ${n.y+24}
        L ${n.x-30} ${n.y}
        Z"></path>
      <text class="label" x="${n.x}" y="${n.y+4}" text-anchor="middle">${escapeHtml(n.label)}</text>
    </g>
  `;
}
/* ============================================================
   Popup inspector: draggable + interactive editing (no external libs)
   ============================================================ */
function deepCopy(x){ return JSON.parse(JSON.stringify(x)); }

function openPopup(node){
  popupNode = node;
  popupOriginalCopy = deepCopy(node.data);
  popupWorkingCopy = deepCopy(node.data);

  document.getElementById("popupTitle").textContent = `${node.label} (${node.type})`;
  document.getElementById("popupInfo").textContent = "Edits update the in-memory model. Click Apply to commit.";

  renderInspector();
  document.getElementById("popup").style.display = "block";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
  popupNode = null;
  popupWorkingCopy = null;
  popupOriginalCopy = null;
}

function revertPopup(){
  if (!popupOriginalCopy) return;
  popupWorkingCopy = deepCopy(popupOriginalCopy);
  renderInspector();
  setStatus("Reverted changes.", true);
}

function applyPopup(){
  if (!popupNode) return;

  // commit edits back to node
  popupNode.data = deepCopy(popupWorkingCopy);

  // also commit back into fullJson at the correct location when possible
  commitNodeToFullJson(popupNode);

  // refresh UI
  renderTree();
  if (currentTab === "code") renderCode();
  buildGraph(fullJson);

  setStatus("Applied changes.", true);
}

function commitNodeToFullJson(node){
  // Only if structure matches expected assembly layout
  if (!fullJson) return;
  const assembly = fullJson.aipp_calculation && fullJson.aipp_calculation.assembly ? fullJson.aipp_calculation.assembly : fullJson.assembly;
  if (!assembly) return;

  if (node.type === "chamber"){
    const idx = parseInt(node.id.substring(1)) - 1;
    if (assembly.chambers && assembly.chambers[idx]) assembly.chambers[idx] = deepCopy(node.data);
  }
  if (node.type === "orifice"){
    const idx = parseInt(node.id.substring(1)) - 1;
    if (assembly.orifices && assembly.orifices[idx]) assembly.orifices[idx] = deepCopy(node.data);
  }
  if (node.type === "wall"){
    const idx = parseInt(node.id.substring(1)) - 1;
    if (assembly.walls && assembly.walls[idx]) assembly.walls[idx] = deepCopy(node.data);
  }
}

function renderInspector(){
  const root = popupWorkingCopy;
  const body = document.getElementById("popupBody");
  body.innerHTML = "";

  const tree = buildInspectorGroup("Object", root, []);
  body.appendChild(tree);
}

function buildInspectorGroup(title, obj, path){
  const group = document.createElement("div");
  group.className = "insGroup";

  const header = document.createElement("div");
  header.className = "insGroupHeader";
  header.innerHTML = `<span>${escapeHtml(title)}</span><span class="pill">${typeLabel(obj)}</span>`;
  group.appendChild(header);

  const body = document.createElement("div");
  body.className = "insGroupBody";
  group.appendChild(body);

  let open = true;
  header.addEventListener("click", ()=>{
    open = !open;
    body.style.display = open ? "block" : "none";
  });

  if (obj === null || typeof obj !== "object"){
    body.appendChild(buildPrimitiveRow("(value)", obj, path));
    return group;
  }

  if (Array.isArray(obj)){
    for (let i=0;i<obj.length;i++){
      const val = obj[i];
      const subPath = path.concat([i]);
      body.appendChild(buildAnyRow("["+i+"]", val, subPath));
    }
    return group;
  }

  const keys = Object.keys(obj);
  keys.sort();
  for (const k of keys){
    const val = obj[k];
    const subPath = path.concat([k]);
    body.appendChild(buildAnyRow(k, val, subPath));
  }

  return group;
}

function buildAnyRow(key, val, path){
  if (val !== null && typeof val === "object"){
    // nested group
    const title = key;
    return buildInspectorGroup(title, val, path);
  }
  return buildPrimitiveRow(key, val, path);
}

function buildPrimitiveRow(key, val, path){
  const row = document.createElement("div");
  row.className = "row";

  const k = document.createElement("div");
  k.className = "key";
  k.textContent = key;

  const v = document.createElement("div");
  v.className = "val";

  // choose editor by type
  const t = typeof val;

  if (t === "boolean"){
    const sel = document.createElement("select");
    sel.innerHTML = `<option value="true">true</option><option value="false">false</option>`;
    sel.value = val ? "true" : "false";
    sel.addEventListener("change", ()=>{
      setAtPath(path, sel.value === "true");
    });
    v.appendChild(sel);
  } else if (t === "number"){
    const inp = document.createElement("input");
    inp.type = "number";
    inp.step = "any";
    inp.value = String(val);
    inp.addEventListener("input", ()=>{
      const n = Number(inp.value);
      if (!Number.isNaN(n)) setAtPath(path, n);
    });
    v.appendChild(inp);
  } else if (val === null){
    const inp = document.createElement("input");
    inp.type = "text";
    inp.value = "null";
    inp.addEventListener("input", ()=>{
      // allow changing null to string/number/bool by raw text
      setAtPath(path, parseLoose(inp.value));
    });
    v.appendChild(inp);
  } else {
    // string (or unknown)
    const txt = String(val);
    if (txt.length > 80){
      const ta = document.createElement("textarea");
      ta.value = txt;
      ta.addEventListener("input", ()=> setAtPath(path, ta.value));
      v.appendChild(ta);
    } else {
      const inp = document.createElement("input");
      inp.type = "text";
      inp.value = txt;
      inp.addEventListener("input", ()=> setAtPath(path, inp.value));
      v.appendChild(inp);
    }
  }

  row.appendChild(k);
  row.appendChild(v);
  return row;
}

function typeLabel(x){
  if (x === null) return "null";
  if (Array.isArray(x)) return "array";
  return typeof x;
}

function setAtPath(path, value){
  // Update popupWorkingCopy at path
  let ref = popupWorkingCopy;
  for (let i=0;i<path.length-1;i++){
    ref = ref[path[i]];
  }
  ref[path[path.length-1]] = value;
}

function parseLoose(s){
  const t = String(s).trim();
  if (t === "null") return null;
  if (t === "true") return true;
  if (t === "false") return false;
  if (/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(t)) return Number(t);
  return t;
}

/* Draggable popup */
(function enableDrag(){
  const popup = document.getElementById("popup");
  const header = document.getElementById("popupHeader");
  let dragging=false, offX=0, offY=0;

  header.addEventListener("mousedown", (e)=>{
    dragging = true;
    offX = e.clientX - popup.offsetLeft;
    offY = e.clientY - popup.offsetTop;
  });

  document.addEventListener("mousemove", (e)=>{
    if (!dragging) return;
    popup.style.left = (e.clientX - offX) + "px";
    popup.style.top  = (e.clientY - offY) + "px";
  });

  document.addEventListener("mouseup", ()=>{
    dragging=false;
  });
})();
/* ============================================================
   fromScilab handler
   ============================================================ */
function fromScilab(msg){
  try{
    const outer = JSON.parse(msg);
    if (!outer || outer.type !== "json_ascii") return;

    const jsonText = asciiToString(outer.data);
    const parsed = JSON.parse(jsonText);

    fullJson = parsed;

    // render UI
    renderTree();
    renderCode(); // keep code ready
    buildGraph(fullJson);

    setStatus("JSON loaded successfully.", true);
  } catch(e){
    setStatus("Failed to parse JSON: " + e.message, false);
  }
}
/* ============================================================
   Browser init notify
   ============================================================ */
window.onload = function(){
  // Initial empty panes
  renderTree();
  renderCode();
  setStatus("Ready. Click Open JSON File.", true);

  // Notify Scilab
  window.toScilab("loaded");
};
